<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotoba Flashcards - Pengolahan Makanan</title>
    <style>
        :root {
            --bg-color: #f7f3f9;
            --card-bg-front: #ffffff;
            --card-bg-back: #fff5f5;
            --primary: #b5ead7;
            --primary-dark: #84cfb7;
            --accent-pink: #ffdac1;
            --accent-purple: #e2f0cb;
            --accent-blue: #c7ceea;
            --text-main: #555555;
            --text-sub: #777777;
            --shadow: 0 10px 25px rgba(160, 150, 170, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #6c5ce7;
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .controls-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 18px;
            border-radius: 25px;
            border: 2px solid #e0e0e0;
            outline: none;
            font-size: 0.95rem;
            background: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .search-bar:focus {
            border-color: #a29bfe;
        }

        .filter-buttons {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .btn {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-main);
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            font-weight: 500;
        }

        .btn:hover {
            background-color: var(--primary);
            border-color: var(--primary-dark);
        }

        .btn.active {
            background-color: var(--accent-blue);
            border-color: #9aa7e0;
            font-weight: bold;
        }

        .flashcard-container {
            width: 100%;
            max-width: 480px;
            height: 280px;
            perspective: 1000px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            border: 2px solid #ffffff;
        }

        .card-front {
            background: linear-gradient(135deg, #ffffff 0%, #fdfbfb 100%);
        }

        .card-back {
            background: linear-gradient(135deg, #fff3f3 0%, #ffedf4 100%);
            transform: rotateY(180deg);
        }

        .kanji {
            font-size: 2.8rem;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 8px;
        }

        .furigana {
            font-size: 1.2rem;
            color: #6c5ce7;
            margin-bottom: 12px;
        }

        .arti {
            font-size: 1.5rem;
            color: #d63031;
            font-weight: 600;
        }

        .badge-mastered {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #e2f0cb;
            color: #4b6584;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            display: none;
        }

        .card-counter {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 0.8rem;
            color: #b2bec3;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 480px;
            justify-content: space-between;
        }

        .nav-btn {
            background-color: #fff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            font-size: 1.2rem;
            color: #555;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
            background-color: var(--primary);
        }

        .action-btn {
            flex-grow: 1;
            height: 45px;
            border-radius: 25px;
            border: none;
            background-color: var(--accent-pink);
            color: #4a4a4a;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .action-btn:hover {
            background-color: #f7c5a8;
        }

        .action-btn.mastered-btn {
            background-color: var(--accent-purple);
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 Kotoba Flashcard</h1>
        <p>Modul Pengolahan Makanan (Tokutei Ginou)</p>
    </header>

    <div class="controls-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="Cari Kanji, Furigana, atau Bahasa Indonesia...">
        <div class="filter-buttons">
            <button class="btn active" onclick="filterData('all', this)">Semua (<span id="countAll">0</span>)</button>
            <button class="btn" onclick="filterData('unmastered', this)">Belum Hafal (<span id="countUnmastered">0</span>)</button>
            <button class="btn" onclick="filterData('mastered', this)">Sudah Hafal (<span id="countMastered">0</span>)</button>
            <button class="btn" onclick="shuffleCards()">🎲 Acak</button>
        </div>
    </div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="card">
            <div class="card-face card-front">
                <span class="card-counter" id="cardCounter">1 / 10</span>
                <span class="badge-mastered" id="badgeMastered">✓ Hafal</span>
                <div class="kanji" id="frontKanji">飲料</div>
                <div class="furigana" id="frontFurigana">いんりょう</div>
            </div>
            <div class="card-face card-back">
                <div class="arti" id="backArti">minuman</div>
            </div>
        </div>
    </div>

    <div class="empty-state" id="emptyState">
        <p>Tidak ada kotoba yang ditemukan ✨</p>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" onclick="prevCard()">❮</button>
        <button class="action-btn" id="toggleMasterBtn" onclick="toggleMastered()">Tanda Sudah Hafal</button>
        <button class="nav-btn" onclick="nextCard()">❯</button>
    </div>

            { id: 12, kanji: "国内生産額", furigana: "こくないせいさんがく", arti: "jumlah produksi dalam negeri" },
            { id: 13, kanji: "数年", furigana: "すうねん", arti: "beberapa tahun" },
            { id: 14, kanji: "兆円", furigana: "ちょうえん", arti: "triliun yen" },

            { id: 25, kanji: "守る", furigana: "まもる", arti: "melindungi" },
            { id: 26, kanji: "信用", furigana: "しんよう", arti: "kredibilitas" },
            { id: 27, kanji: "安全保護具", furigana: "あんぜんほごぐ", arti: "peralatan perlindungan keselamatan" },
            { id: 28, kanji: "着用", furigana: "ちゃくよう", arti: "memakai" },
            { id: 29, kanji: "作業者", furigana: "さぎょうしゃ", arti: "pekerja" },
            { id: 30, kanji: "健康", furigana: "けんこう", arti: "kesehatan" },
            { id: 31, kanji: "基本", furigana: "きほん", arti: "dasar" },
            { id: 32, kanji: "行動", furigana: "こうどう", arti: "tindakan" },
            { id: 33, kanji: "清潔", furigana: "せいけつ", arti: "kebersihan" },
            { id: 34, kanji: "設備", furigana: "せつび", arti: "fasilitas" },
            { id: 35, kanji: "保管", furigana: "ほかん", arti: "penyimpanan" },
            { id: 36, kanji: "共通する", furigana: "きょうつうする", arti: "memiliki kesamaan" },
            { id: 37, kanji: "一般", furigana: "いっぱん", arti: "umum" },
            { id: 38, kanji: "重要", furigana: "じゅうよう", arti: "penting" },
            { id: 39, kanji: "施設", furigana: "しせつ", arti: "fasilitas" },
            { id: 40, kanji: "種類", furigana: "しゅるい", arti: "jenis" },
            { id: 41, kanji: "特徴", furigana: "とくちょう", arti: "fitur / ciri" },
            { id: 42, kanji: "応じて", furigana: "おうじて", arti: "bergantung kepada" },
            { id: 43, kanji: "工程", furigana: "こうてい", arti: "proses" },
            { id: 44, kanji: "組み合わせて", furigana: "くみあわせて", arti: "dalam kombinasi" },
            { id: 45, kanji: "危害要因", furigana: "きがいよういん", arti: "faktor bahaya" },
            { id: 46, kanji: "物理的危害要因", furigana: "ぶつりてききがいよういん", arti: "bahaya fisik" },
            { id: 47, kanji: "化学的危害要因", furigana: "かがくてききがいよういん", arti: "bahaya kimia" },
            { id: 48, kanji: "生物的危害要因", furigana: "せいぶつてききがいよういん", arti: "bahaya biologis" },
            { id: 49, kanji: "硬い", furigana: "かたい", arti: "keras" },
            { id: 50, kanji: "金属片", furigana: "きんぞくへん", arti: "serpihan logam" },
            { id: 51, kanji: "ガラス片", furigana: "ガラスへん", arti: "sepotong kaca" },
            { id: 52, kanji: "プラスチック片", furigana: "プラスチックへん", arti: "potongan plastik" },
            { id: 53, kanji: "異物", furigana: "いぶつ", arti: "benda asing" },
            { id: 54, kanji: "混入", furigana: "こんにゅう", arti: "kontaminasi" },
            { id: 55, kanji: "防止", furigana: "ぼうし", arti: "pencegahan" },
            { id: 56, kanji: "洗浄", furigana: "せんじょう", arti: "pencucian" },
            { id: 57, kanji: "選別", furigana: "せんべつ", arti: "penyortiran" },
            { id: 58, kanji: "下処理", furigana: "したしょり", arti: "persiapan awal" },
            { id: 59, kanji: "不潔", furigana: "ふけつ", arti: "kekotoran" },
            { id: 60, kanji: "不衛生", furigana: "ふえいせい", arti: "tidak sehat" },
            { id: 61, kanji: "苦情(クレーム)", furigana: "くじょう", arti: "keluhan (klaim)" },
            { id: 62, kanji: "食中毒", furigana: "しょくちゅうどく", arti: "keracunan makanan" },
            { id: 63, kanji: "細菌", furigana: "さいきん", arti: "bakteri" },
            { id: 64, kanji: "寄生虫", furigana: "きせいちゅう", arti: "parasit" },
            { id: 65, kanji: "カビ", furigana: "かび", arti: "jamur" },
            { id: 66, kanji: "予防", furigana: "よぼう", arti: "pencegahan" },
            { id: 67, kanji: "加熱", furigana: "かねつ", arti: "pemanasan" },
            { id: 68, kanji: "消毒", furigana: "しょうどく", arti: "desinfeksi" },
            { id: 69, kanji: "整理", furigana: "せいり", arti: "meringkas" },
            { id: 70, kanji: "整頓", furigana: "せいとん", arti: "merapikan" },
            { id: 71, kanji: "清掃", furigana: "せいそう", arti: "pembersihan" },
            { id: 72, kanji: "しつけ", furigana: "しつけ", arti: "disiplin" },
            { id: 73, kanji: "交差汚染", furigana: "こうさおせん", arti: "kontaminasi silang" },
            { id: 74, kanji: "ゾーニング", furigana: "ぞーにんぐ", arti: "zonasi" },
            { id: 75, kanji: "検便", furigana: "けんべん", arti: "tes tinja" },
            { id: 76, kanji: "労働災害", furigana: "ろうどうさいがい", arti: "kecelakaan kerja" },
            { id: 77, kanji: "転倒", furigana: "てんとう", arti: "jatuh" },
            { id: 78, kanji: "熱中症", furigana: "ねっちゅうしょう", arti: "heatstroke / sengatan panas" },
            { id: 79, kanji: "指差呼称", furigana: "しさこしょう", arti: "menunjuk dan memanggil" },
            { id: 80, kanji: "非常口", furigana: "ひじょうぐち", arti: "pintu darurat" }
        ];

        let displayData = [...rawKotobaData];
        let currentIndex = 0;
        let masteredIds = JSON.parse(localStorage.getItem('masteredKotoba')) || [];
        let currentFilter = 'all';

        // Elements
        const cardEl = document.getElementById('card');
        const frontKanji = document.getElementById('frontKanji');
        const frontFurigana = document.getElementById('frontFurigana');
        const backArti = document.getElementById('backArti');
        const cardCounter = document.getElementById('cardCounter');
        const badgeMastered = document.getElementById('badgeMastered');
        const toggleMasterBtn = document.getElementById('toggleMasterBtn');
        const searchInput = document.getElementById('searchInput');
        const emptyState = document.getElementById('emptyState');
        const cardContainer = document.querySelector('.flashcard-container');

        function updateCounts() {
            document.getElementById('countAll').innerText = rawKotobaData.length;
            document.getElementById('countMastered').innerText = masteredIds.length;
            document.getElementById('countUnmastered').innerText = rawKotobaData.length - masteredIds.length;
        }

        function filterData(type, btnElement) {
            currentFilter = type;
            if (btnElement) {
                document.querySelectorAll('.filter-buttons .btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            const query = searchInput.value.toLowerCase().trim();

            displayData = rawKotobaData.filter(item => {
                const matchesSearch = item.kanji.toLowerCase().includes(query) || 
                                      item.furigana.toLowerCase().includes(query) || 
                                      item.arti.toLowerCase().includes(query);
                
                const isMastered = masteredIds.includes(item.id);
                
                if (type === 'mastered') return matchesSearch && isMastered;
                if (type === 'unmastered') return matchesSearch && !isMastered;
                return matchesSearch;
            });

            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            if (displayData.length === 0) {
                cardContainer.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            cardContainer.style.display = 'block';
            emptyState.style.display = 'none';
            cardEl.classList.remove('flipped');

            const item = displayData[currentIndex];
            frontKanji.innerText = item.kanji;
            frontFurigana.innerText = item.furigana;
            backArti.innerText = item.arti;
            cardCounter.innerText = `${currentIndex + 1} / ${displayData.length}`;

            const isMastered = masteredIds.includes(item.id);
            if (isMastered) {
                badgeMastered.style.display = 'inline-block';
                toggleMasterBtn.innerText = 'Tandai Belum Hafal';
                toggleMasterBtn.classList.remove('mastered-btn');
            } else {
                badgeMastered.style.display = 'none';
                toggleMasterBtn.innerText = 'Tandai Sudah Hafal ✓';
                toggleMasterBtn.classList.add('mastered-btn');
            }
        }

        function flipCard() {
            cardEl.classList.toggle('flipped');
        }

        function nextCard() {
            if (displayData.length === 0) return;
            currentIndex = (currentIndex + 1) % displayData.length;
            renderCard();
        }

        function prevCard() {
            if (displayData.length === 0) return;
            currentIndex = (currentIndex - 1 + displayData.length) % displayData.length;
            renderCard();
        }

        function toggleMastered() {
            if (displayData.length === 0) return;
            const currentItem = displayData[currentIndex];
            const index = masteredIds.indexOf(currentItem.id);

            if (index > -1) {
                masteredIds.splice(index, 1);
            } else {
                masteredIds.push(currentItem.id);
            }

            localStorage.setItem('masteredKotoba', JSON.stringify(masteredIds));
            updateCounts();
            
            if (currentFilter !== 'all') {
                filterData(currentFilter, null);
            } else {
                renderCard();
            }
        }

        function shuffleCards() {
            for (let i = displayData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [displayData[i], displayData[j]] = [displayData[j], displayData[i]];
            }
            currentIndex = 0;
            renderCard();
        }

        searchInput.addEventListener('input', () => {
            filterData(currentFilter, null);
        });

        // Initialize
        updateCounts();
        renderCard();
    </script>
</body>
</html>
